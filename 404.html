<!DOCTYPE html>
<html lang="es-PA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página no encontrada — AD Curundú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{ --green:#2bad6d; --green-dark:#1f9059; --ink:#0c3d27; }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
          background:linear-gradient(135deg,#064d2a 0%,#0a6e3c 60%,#0d8a4c 100%); color:#fff;
          font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; text-align:center; padding:2rem; }
    .box{ max-width:520px; }
    .code{ font-family:'League Spartan',sans-serif; font-weight:700; font-size:clamp(4rem,18vw,8rem); line-height:1; letter-spacing:-0.02em; }
    h1{ font-family:'League Spartan',sans-serif; font-weight:600; font-size:clamp(1.3rem,4vw,1.9rem); margin:.4rem 0 1rem; }
    p{ color:rgba(255,255,255,0.85); line-height:1.6; margin:0 0 2rem; }
    a.btn{ display:inline-block; background:#fff; color:var(--green-dark); font-family:'League Spartan',sans-serif;
           font-weight:700; text-transform:uppercase; letter-spacing:.04em; text-decoration:none;
           padding:.85rem 1.8rem; border-radius:100px; transition:transform .2s; }
    a.btn:hover{ transform:translateY(-2px); }
    .links{ margin-top:1.5rem; font-size:.9rem; }
    .links a{ color:#fff; text-decoration:underline; margin:0 .6rem; opacity:.9; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>Lo sentimos, la página que buscas no existe o fue movida. Vuelve al inicio para encontrar lo que necesitas.</p>
    <a class="btn" href="/">Volver al inicio</a>
    <div class="links">
      <a href="/participar.html">Participar</a>·
      <a href="/donar.html">Apoyar</a>·
      <a href="/contactanos.html">Contáctanos</a>
    </div>
  </div>
</body>
</html>
